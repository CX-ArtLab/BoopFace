<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoopFace — React Example</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#f7f7f5;font-family:system-ui,sans-serif}
    #root{display:grid;gap:20px;justify-items:center}
    button{border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
    p{margin:0;color:#666;font-size:13px;min-height:1.4em}
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    React 19 renders <boop-face> like any HTML tag. This page loads React from a CDN
    so it runs without a build step; in a Vite or Next.js app, import from 'react'
    and 'boopface' instead and write the same component in JSX:

      function Avatar() {
        const ref = useRef(null);
        useEffect(() => { agentRef.current = connectAgent(ref.current); }, []);
        return <boop-face ref={ref} size="140" />;
      }

    In Next.js, put the component in a file marked 'use client'.
  -->
  <script type="module">
    import { createElement as h, useEffect, useRef, useState } from 'https://esm.sh/react@19';
    import { createRoot } from 'https://esm.sh/react-dom@19/client';
    import { connectAgent } from '../boopface.js';

    // Pretend AI reply: thinking, then text, then done.
    async function* fakeStream() {
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      yield { type: 'RUN_STARTED' };
      await wait(1500);
      for (const word of ['Hello', ' from', ' React', '.']) {
        yield { type: 'TEXT_MESSAGE_CONTENT', delta: word };
        await wait(250);
      }
      yield { type: 'RUN_FINISHED' };
    }

    function App() {
      const avatarRef = useRef(null);
      const agentRef = useRef(null);
      const [reply, setReply] = useState('');

      useEffect(() => {
        agentRef.current = connectAgent(avatarRef.current);
      }, []);

      async function ask() {
        setReply('');
        for await (const event of agentRef.current.track(fakeStream())) {
          if (event.delta) setReply(text => text + event.delta);
        }
      }

      return h('div', { style: { display: 'contents' } },
        h('boop-face', { ref: avatarRef, size: '140' }),
        h('p', null, reply),
        h('button', { type: 'button', onClick: ask }, 'Ask'),
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
