<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>全部皮肤 · BoopFace</title>
  <link rel="icon" href="../favicon-white.svg" type="image/svg+xml">
  <link rel="modulepreload" href="../../boopface.js">
  <link rel="modulepreload" href="../skin-catalog.js">
  <link rel="modulepreload" href="../../src/skins/catalog.js">
  <link rel="modulepreload" href="../../src/skins/paints.js">
  <link rel="modulepreload" href="../../src/skins/eyelids.js">
  <link rel="modulepreload" href="../../src/skins/native.js">
  <link rel="modulepreload" href="../../src/skins/material-library.js">
  <link rel="stylesheet" href="../fonts/geist.css">
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" id="back-to-studio" href="../index.html#skins">
      <boop-face size="28" auto-sleep="0" color="#ffffff" eye-color="#000000" press-squeeze="false" antenna-drag="false"></boop-face>
      <span class="brand-name">BoopFace</span>
      <span class="badge">Studio</span>
    </a>
    <a class="back-btn" id="back-btn" href="../index.html#skins">← 返回 Studio</a>
  </header>
  <main class="catalog">
    <aside class="side" aria-label="筛选皮肤">
      <div class="side-head"><h1 id="catalog-title">全部皮肤</h1><span id="catalog-count"></span></div>
      <label class="search"><span class="sr-only" id="search-label">搜索皮肤</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="skin-search" type="search" placeholder="搜索皮肤" autocomplete="off"></label>
      <div class="filters" id="skin-filters" aria-label="皮肤分类"></div>
    </aside>
    <div class="results">
      <div class="sections" id="skin-grid" aria-label="选择皮肤"></div>
      <div class="empty" id="empty-state" hidden><p id="empty-text">未找到皮肤</p><button id="clear-search" type="button">查看全部</button></div>
    </div>
  </main>
  <noscript>请启用 JavaScript。</noscript>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
